<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--SEO_HEAD-->
    <title>Bear Cave Drive Thru | The Coldest Beer in Town, Without Leaving Your Car</title>
    <meta name="description" content="Wadsworth's drive-thru beverage store. Beer, wine, seltzers, pop, snacks, candy, and lottery handed through your car window at 474 College St. In and out in about a minute. Open seven days." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1d2a44" />

    <link rel="icon" type="image/webp" href="/images/bear-cave-logo.webp" />
    <link rel="apple-touch-icon" href="/images/bear-cave-logo.webp" />

    <link rel="preload" href="/fonts/ClashDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Supreme-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/hero-frost-bg.webp" as="image" type="image/webp" fetchpriority="high" />

    <!-- Consent-gated Microsoft Clarity. Vite substitutes %VITE_CLARITY_ID% at
         build time; until the env var is set this stays a harmless no-op.
         CookieConsent.tsx calls window.loadClarity() on accept. -->
    <script>
      window.__CLARITY_ID = "%VITE_CLARITY_ID%";
      window.loadClarity = function () {
        var id = window.__CLARITY_ID;
        if (!id || id.indexOf("%") !== -1 || document.getElementById("clarity-script")) return;
        var s = document.createElement("script");
        s.id = "clarity-script";
        s.async = true;
        s.src = "https://www.clarity.ms/tag/" + id;
        document.head.appendChild(s);
      };
      try {
        if (localStorage.getItem("bc.cookieConsent") === "accepted") window.loadClarity();
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Simply Visible analytics --><script src="https://simplyvisible.online/track.js" defer></script>
  </body>
</html>
